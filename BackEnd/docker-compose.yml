version: "3.8"

services:
  # Serviço da Base de Dados
  mongo_db:
    image: mongo:7.0
    container_name: tomar_mongo
    # MongoDB needs to run as a replica set to support multi-document transactions
    # (used by the /apagarConta endpoint for atomic cascade deletes).
    # A single-node replica set has zero downside for local development and
    # mirrors how production (Azure / Cosmos DB / Atlas) is configured.
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017" # Abre a porta para o teu PC aceder
    volumes:
      - mongo_data:/data/db # Isto garante que os dados não somem se desligares o PC!
    # The healthcheck auto-initiates the replica set on first boot.
    # On subsequent boots, rs.status().ok returns 1 immediately and the
    # command exits 0 (healthy). The catch block only runs the first time.
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { if (rs.status().ok === 1) quit(0); } catch (e) {}
         rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mongo_data:
